<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระดับน้ำ จ.สระบุรี</title>
<style>
:root{--bg:#f6f8fa;--fg:#1f2328;--card:#fff;--mut:#656d76;--bd:#d0d7de}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--card:#161b22;--mut:#8b949e;--bd:#30363d}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,"Noto Sans Thai",sans-serif}
main{max-width:960px;margin:auto;padding:16px}
h1{font-size:1.4rem;margin:0}
.sub{color:var(--mut);font-size:.85rem;margin:2px 0 16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-left:6px solid var(--c,#999);border-radius:8px;padding:12px}
.card h2{font-size:1rem;margin:0}
.loc,.mut{color:var(--mut);font-size:.85rem}
.big{font-size:1.6rem;font-weight:600}
.tag{display:inline-block;padding:0 8px;border-radius:99px;font-size:.8rem;color:#fff;background:var(--c,#999)}
.warn{color:#cf222e;font-size:.85rem}
.bar{height:6px;background:var(--bd);border-radius:3px;margin:6px 0}
.bar i{display:block;height:100%;border-radius:3px;background:var(--c,#999)}
svg{width:100%;height:36px}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body>
<main>
<h1>🌊 ระดับน้ำ จ.สระบุรี</h1>
<div class="sub" id="upd">กำลังโหลด…</div>
<div id="map" style="height:380px;border:1px solid var(--bd);border-radius:8px;margin-bottom:6px"></div>
<div class="mut" style="margin-bottom:12px">สีตามระดับน้ำ: เขียว=ปกติ น้ำเงิน=น้ำมาก แดง=ล้นตลิ่ง · จุดใหญ่=ท้ายเขื่อนพระราม 6 · แผนที่ © OpenStreetMap</div>
<div class="grid" id="g"></div>
<p class="mut">ข้อมูลอัตโนมัติจาก ThaiWater (สสน.) และกรมชลประทาน ไม่ใช่ประกาศทางการ โปรดติดตาม ปภ./กรมชลประทาน</p>
  <p>สร้างขึ้นเพื่อใช้ส่วนตัวเท่านั้น | พัฒนาโดย น้องตั้มน่ารัก </p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const C={1:"#8d6e63",2:"#d4a72c",3:"#2da44e",4:"#0969da",5:"#cf222e"};
const LBL={1:"น้ำน้อยวิกฤติ",2:"น้ำน้อย",3:"ปกติ",4:"น้ำมาก",5:"ล้นตลิ่ง"};
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f=(v,d=2)=>v==null?"-":Number(v).toFixed(d);
function spark(h,c){
  if(!h||h.length<2)return"";
  const x0=h[0][0],xs=h[h.length-1][0]-x0||1,ys=h.map(p=>p[1]),lo=Math.min(...ys),hi=Math.max(...ys),r=hi-lo||1;
  const pts=h.map(p=>`${((p[0]-x0)/xs*300).toFixed(1)},${(34-(p[1]-lo)/r*32).toFixed(1)}`).join(" ");
  return`<svg viewBox="0 0 300 36" preserveAspectRatio="none"><polyline fill="none" stroke="${c}" stroke-width="2" points="${pts}"/></svg>`;
}
function card(s){
  const c=C[s.level]||"#999",gap=s.bank&&s.wl!=null?s.bank-s.wl:null;
  const pct=s.pct==null?"":Math.min(100,s.pct);
  return`<div class="card" style="--c:${c}"><h2>${esc(s.name)}</h2>
  <div class="loc">${esc([s.river,s.amphoe&&"อ."+s.amphoe].filter(Boolean).join(" "))}</div>
  <div><span class="big">${f(s.wl)}</span> ม.รทก. <span class="tag">${LBL[s.level]||"ไม่ทราบ"}</span></div>
  ${pct!==""?`<div class="bar"><i style="width:${pct}%"></i></div>`:""}
  <div class="mut">ตลิ่ง ${f(s.bank)} ม.${gap==null?"":gap>=0?` · ต่ำกว่า ${f(gap)} ม.`:` · สูงกว่า ${f(-gap)} ม.`}${s.pct!=null?` · ${f(s.pct,0)}%`:""}</div>
  <div class="mut">3 ชม.ที่ผ่านมา: ${s.rise==null?"-":(s.rise>0?"+":"")+f(s.rise)+" ม."}</div>
  ${spark(s.hist,c)}
  <div class="mut">ข้อมูลเมื่อ ${esc(s.time)}</div>
  ${s.stale?'<div class="warn">⏱ ข้อมูลไม่อัปเดตนาน</div>':""}</div>`;
}
function damCard(d,err){
  if(!d)return`<div class="card"><h2>🏞 เขื่อนป่าสักชลสิทธิ์</h2><div class="warn">⚠️ ดึงข้อมูลไม่สำเร็จ${err?": "+esc(err):""}</div></div>`;
  const c=d.pct>=110?"#82071e":d.pct>=100?C[5]:d.pct>=90?"#bc4c00":d.pct>=70?C[4]:C[3];
  const lab=d.pct>=110?"วิกฤตมาก":d.pct>=100?"วิกฤต":d.pct>=90?"เฝ้าระวัง":"";
  return`<div class="card" style="--c:${c}"><h2>🏞 ${esc(d.name)}</h2>
  <div><span class="big">${f(d.pct,0)}%</span> ของความจุเก็บกัก ${lab?`<span class="tag">${lab}</span>`:""}</div>
  <div class="bar"><i style="width:${Math.min(100,d.pct||0)}%"></i></div>
  <div class="mut">น้ำในเขื่อน ${f(d.volume,0)} / ${f(d.capacity,0)} ล้าน ลบ.ม.</div>
  <div class="mut">ไหลเข้า ${f(d.inflow)} · ระบาย ${f(d.outflow)}</div>
  <div class="mut">ข้อมูลวันที่ ${esc(d.date)}</div></div>`;
}
// เกณฑ์อัตราไหล (ลบ.ม./วิ) ต้องตรงกับ RAMA6_Q_LEVELS ในบอท
function rama6Card(r,err){
  if(!r)return`<div class="card"><h2>🚧 เขื่อนพระราม 6 (ท้ายเขื่อน)</h2><div class="warn">⚠️ ดึงข้อมูลไม่สำเร็จ${err?": "+esc(err):""}</div></div>`;
  const q=r.discharge,crit=r.crit!=null&&r.wl!=null&&r.wl>=r.crit;
  const lv=crit||q>=700?["#cf222e","ระบายน้ำสูงมาก"]:q>=600?["#bc4c00","ระบายน้ำมาก"]:q>=400?["#d4a72c","ระบายน้ำสูง"]:["#2da44e","ปกติ"];
  const pct=r.qmax&&q!=null?Math.min(100,q/r.qmax*100):"";
  const gap=r.bank&&r.wl!=null?r.bank-r.wl:null;
  return`<div class="card" style="--c:${lv[0]}"><h2>🚧 เขื่อนพระราม 6 (ท้ายเขื่อน S.26)</h2>
  <div class="loc">แม่น้ำป่าสัก อ.ท่าเรือ จ.พระนครศรีอยุธยา</div>
  <div><span class="big">${f(q,0)}</span> ลบ.ม./วิ <span class="tag">${lv[1]}</span></div>
  ${pct!==""?`<div class="bar"><i style="width:${pct}%"></i></div>`:""}
  <div class="mut">${r.qmax?`ความจุลำน้ำ ~${f(r.qmax,0)} ลบ.ม./วิ · `:""}ระดับน้ำ ${f(r.wl)} ม.รทก.</div>
  <div class="mut">ตลิ่ง ${f(r.bank)} ม.${gap==null?"":gap>=0?` · ต่ำกว่า ${f(gap)} ม.`:` · สูงกว่า ${f(-gap)} ม.`}${r.crit!=null?` · วิกฤต ${f(r.crit)} ม.`:""}</div>
  <div class="mut">ข้อมูลเมื่อ ${esc(r.time)}</div>
  ${r.stale?'<div class="warn">⏱ ข้อมูลไม่อัปเดตนาน ตัวเลขอาจไม่ใช่สถานการณ์ปัจจุบัน</div>':""}</div>`;
}
function upCard(us){
  const rows=us.map(s=>{const c=C[s.level]||"#999";return`<div style="margin:6px 0"><b>${esc(s.name)}</b> <span class="tag" style="--c:${c}">${LBL[s.level]||"?"}</span><div class="mut">${esc(s.loc)} · ${f(s.wl)} ม.รทก. · ${s.rise==null?"-":(s.rise>0?"+":"")+f(s.rise)} ม./6 ชม. · ถึงเขื่อนป่าสักฯ ${esc(s.lag)} (ประมาณ)</div></div>`}).join("");
  return`<div class="card" style="--c:${C[4]}"><h2>⛰ ต้นน้ำป่าสัก (เพชรบูรณ์)</h2>${rows}</div>`;
}
function rainCard(r,t){
  r=r||{};const days=(r.days||[]).filter(x=>x.date>=r.today),n3=r.next3,tn=t&&t.next3;
  const mm3=Math.max(n3?n3.mm:0,tn?tn.mm:0);
  const mx=Math.max(0,...days.map(x=>x.max)),c3=mm3>=60?C[5]:mm3>=30?"#bc4c00":0;
  const c=c3===C[5]||mx>=90?C[5]:c3||mx>=35?"#bc4c00":mx>=10?C[4]:C[3];
  const h3=(tn?`<div class="mut">⏱ ${tn.hours} ชม.ข้างหน้า (กรมอุตุฯ TMD): <b>${f(tn.mm,0)}</b> มม. (${esc(tn.where)})</div>`:"")+(n3?`<div class="mut">⏱ ${n3.hours} ชม.ข้างหน้า (Open-Meteo): <b>${f(n3.mm,0)}</b> มม. (${esc(n3.where)})</div>`:"");
  return`<div class="card" style="--c:${c}"><h2>🌧 พยากรณ์ฝน ลุ่มน้ำป่าสักตอนบน</h2>${h3}${days.map(x=>`<div class="mut">${esc(x.date)}: <b>${f(x.max,0)}</b> มม. (${esc(x.where)}) · เฉลี่ย ${f(x.avg,0)}${x.prob==null?"":" · โอกาสฝน "+f(x.prob,0)+"%"}</div>`).join("")}<div class="mut">รายวัน/3 ชม.จากแบบจำลอง Open-Meteo ไม่ใช่ประกาศกรมอุตุฯ${tn?" · ส่วน TMD คือพยากรณ์รายชั่วโมงของกรมอุตุฯ":""}</div></div>`;
}
let MAP,LAYER,FIT=false;
const DAM_POS=null; // ใส่ [ละติจูด, ลองจิจูด] ของเขื่อนป่าสักชลสิทธิ์ เมื่อทราบพิกัดที่ถูกต้อง
function drawMap(d){
  const LF=window.L;if(!LF||!document.getElementById("map"))return;
  if(!MAP){MAP=LF.map("map",{scrollWheelZoom:false});LF.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:17,attribution:"© OpenStreetMap"}).addTo(MAP);LAYER=LF.layerGroup().addTo(MAP);}
  LAYER.clearLayers();const pts=[];
  const add=(lat,lon,c,r,html)=>{if(lat==null||lon==null)return;pts.push([lat,lon]);LF.circleMarker([lat,lon],{radius:r,color:"#fff",weight:2,fillColor:c,fillOpacity:.9}).bindPopup(html).addTo(LAYER);};
  d.stations.forEach(s=>add(s.lat,s.lon,C[s.level]||"#999",8,`<b>${esc(s.name)}</b><br>${f(s.wl)} ม.รทก. · ${LBL[s.level]||"ไม่ทราบ"}`));
  (d.upstream||[]).forEach(s=>add(s.lat,s.lon,C[s.level]||"#999",8,`<b>${esc(s.name)}</b> (ต้นน้ำ)<br>${f(s.wl)} ม.รทก. · ${LBL[s.level]||"ไม่ทราบ"}`));
  const r=d.rama6;if(r)add(r.lat,r.lon,C[r.level]||"#999",13,`<b>ท้ายเขื่อนพระราม 6</b><br>${f(r.discharge,0)} ลบ.ม./วิ · ${f(r.wl)} ม.รทก.`);
  if(DAM_POS&&d.dam)add(DAM_POS[0],DAM_POS[1],d.dam.pct>=100?C[5]:d.dam.pct>=90?"#bc4c00":C[3],13,`<b>${esc(d.dam.name)}</b><br>${f(d.dam.pct,0)}% ของความจุเก็บกัก`);
  if(pts.length&&!FIT){MAP.fitBounds(pts,{padding:[30,30]});FIT=true;}
}
function chartCard(title,series,lines,unit,dec){
  const W=600,H=220,ml=46,mr=10,mt=10,mb=26,all=series.flatMap(s=>s.pts);
  const xs=all.map(p=>p[0]),ys=all.map(p=>p[1]).concat(lines.map(l=>l.y));
  const x0=Math.min(...xs),x1=Math.max(...xs);let y0=Math.min(...ys),y1=Math.max(...ys);
  if(y1==y0){y1+=1;y0-=1}const pd=(y1-y0)*.08;y0-=pd;y1+=pd;
  const X=t=>ml+(t-x0)/((x1-x0)||1)*(W-ml-mr),Y=v=>mt+(1-(v-y0)/(y1-y0))*(H-mt-mb);
  const tm=t=>new Date(t*1000).toLocaleString("th-TH",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
  const tx=(x,y,a,t,fill,op)=>`<text x="${x}" y="${y}" text-anchor="${a}" font-size="11" fill="${fill||"currentColor"}" opacity="${op||.7}">${t}</text>`;
  let g="";
  for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4;g+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--bd)"/>`+tx(ml-4,Y(v)+4,"end",f(v,dec));}
  lines.forEach(l=>{g+=`<line x1="${ml}" x2="${W-mr}" y1="${Y(l.y)}" y2="${Y(l.y)}" stroke="${l.color}" stroke-dasharray="5 4"/>`+tx(W-mr,Y(l.y)-3,"end",esc(l.label),l.color,1);});
  series.forEach(s=>{g+=`<polyline fill="none" stroke="${s.color}" stroke-width="2" points="${s.pts.map(p=>X(p[0]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ")}"><title>${esc(s.name)}</title></polyline>`;});
  g+=tx(ml,H-6,"start",tm(x0))+tx(W-mr,H-6,"end",tm(x1));
  const lg=series.map(s=>`<span style="margin-right:12px;white-space:nowrap"><i style="display:inline-block;width:10px;height:10px;background:${s.color};border-radius:2px"></i> ${esc(s.name)} <b>${f(s.pts[s.pts.length-1][1],dec)}</b></span>`).join("");
  return`<div class="card" style="grid-column:1/-1;--c:#999"><h2>📈 ${esc(title)}</h2><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${g}</svg><div class="mut">${lg} ${esc(unit)}</div></div>`;
}
function trends(d){
  try{
    const pal=["#0969da","#2da44e","#bc4c00","#8250df","#cf222e","#6e7781"],ok=a=>a&&a.length>1;let out="";
    const st=d.stations.filter(s=>s.bank&&ok(s.hist));
    if(st.length)out+=chartCard("ระดับน้ำเทียบตลิ่ง จ.สระบุรี (48 ชม.) · 0 = ระดับตลิ่ง, ค่าบวก = ล้นตลิ่ง",st.map((s,i)=>({name:s.name,color:pal[i%pal.length],pts:s.hist.map(p=>[p[0],p[1]-s.bank])})),[{y:0,label:"ตลิ่ง",color:"#cf222e"}],"ม.",2);
    const r=d.rama6;
    if(r&&ok(r.hist))out+=chartCard("อัตราไหลท้ายเขื่อนพระราม 6 (24 ชม.)",[{name:"อัตราไหล",color:"#0969da",pts:r.hist}],[{y:400,label:"400",color:"#d4a72c"},{y:600,label:"600",color:"#bc4c00"},{y:700,label:"700",color:"#cf222e"}],"ลบ.ม./วิ",0);
    const up=(d.upstream||[]).filter(s=>ok(s.hist));
    if(up.length)out+=chartCard("ต้นน้ำป่าสัก: ระดับน้ำที่เปลี่ยนไปจากจุดเริ่มต้น (24 ชม.)",up.map((s,i)=>({name:s.name,color:pal[i%pal.length],pts:s.hist.map(p=>[p[0],p[1]-s.hist[0][1]])})),[{y:0,label:"",color:"#8b949e"}],"ม.",2);
    return out;
  }catch(e){console.warn(e);return"";}
}
async function load(){
  if(location.protocol==="file:"){
    upd.innerHTML="⚠️ เปิดจากไฟล์ในเครื่องไม่ได้ ต้องเปิดผ่านลิงก์ GitHub Pages (https://…github.io/…) เพราะหน้านี้ต้องโหลดไฟล์ data.json จากเซิร์ฟเวอร์";
    return;
  }
  let step="ดึงไฟล์ data.json";
  try{
    const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error(r.status===404
      ?"ไม่พบไฟล์ data.json (404) — บอทยังไม่เคยรันสำเร็จจนเขียนไฟล์นี้ หรือรอบล่าสุดที่เผยแพร่เป็นโหมด debug ให้รัน workflow โหมด summary หรือ alert อีกครั้ง"
      :"เซิร์ฟเวอร์ตอบ HTTP "+r.status);
    step="อ่านรูปแบบข้อมูล";
    const d=await r.json();
    step="แสดงผล";
    const st=[...d.stations].sort((a,b)=>(b.level||0)-(a.level||0));
    const has6=d.rama6||d.rama6_error; // data.json รุ่นเก่ายังไม่มีคีย์นี้
    g.innerHTML=st.map(card).join("")+damCard(d.dam,d.dam_error)+(has6?rama6Card(d.rama6,d.rama6_error):"")+(d.upstream&&d.upstream.length?upCard(d.upstream):"")+((d.rain||d.tmd)?rainCard(d.rain,d.tmd):"");
    try{drawMap(d)}catch(e){console.warn(e)}
    g.insertAdjacentHTML("beforeend",trends(d));
    const ageMin=Math.round((Date.now()/1000-d.updated)/60);
    upd.textContent="อัปเดตล่าสุด "+new Date(d.updated*1000).toLocaleString("th-TH")+" · รีเฟรชอัตโนมัติ";
    if(ageMin>45){
      const t=ageMin>=120?Math.floor(ageMin/60)+" ชม.":ageMin+" นาที";
      upd.innerHTML+=`<div class="warn" style="font-weight:600;margin-top:4px">⚠️ ข้อมูลบนหน้านี้เก่ากว่า ${t} — ระบบดึงข้อมูลอัตโนมัติอาจหยุดทำงาน อย่าใช้ตัวเลขนี้เป็นสถานการณ์ปัจจุบัน ตรวจที่ thaiwater.net หรือ ปภ. โดยตรง</div>`;
    }
  }catch(e){upd.textContent="⚠️ โหลดข้อมูลไม่สำเร็จ (ขั้น: "+step+") — "+(e&&e.message||e);}
}
load();setInterval(load,60000);
</script>
</body>
</html>
