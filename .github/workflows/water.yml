name: Saraburi Water Alert

on:
  schedule:
    - cron: "*/15 * * * *"   # ตรวจทุก 15 นาที (สรุป 07:00/13:00 เวลาไทย บอตส่งเองตามเวลา)
  workflow_dispatch:         # กดรันเองจากหน้าเว็บได้
    inputs:
      mode:
        description: "โหมดการรัน"
        type: choice
        default: alert
        options:
          - alert
          - summary
          - debug

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: saraburi-water
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # เก็บ state.json ข้ามรอบ: restore อันล่าสุด แล้ว save ใหม่ด้วย key ที่ไม่ซ้ำ
      - name: Restore state
        uses: actions/cache@v5
        with:
          path: state.json
          key: water-state-${{ github.run_id }}
          restore-keys: |
            water-state-

      - name: Run bot
        id: bot
        continue-on-error: true   # ให้ขั้นตอนเผยแพร่เว็บทำงานต่อแม้บอตมีปัญหาบางส่วน (ท้ายไฟล์จะทำให้รอบขึ้นแดง)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TMD_TOKEN: ${{ secrets.TMD_TOKEN }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          ARGS=""
          if [ "$MODE" = "summary" ]; then ARGS="--summary"; fi
          if [ "$MODE" = "debug" ]; then ARGS="--debug"; fi
          python saraburi_water_bot.py $ARGS

      - uses: actions/configure-pages@v6
        if: ${{ !cancelled() && github.event.inputs.mode != 'debug' && hashFiles('site/data.json') != '' }}
      - uses: actions/upload-pages-artifact@v5
        if: ${{ !cancelled() && github.event.inputs.mode != 'debug' && hashFiles('site/data.json') != '' }}
        with:
          path: site
      - uses: actions/deploy-pages@v5
        if: ${{ !cancelled() && github.event.inputs.mode != 'debug' && hashFiles('site/data.json') != '' }}

      - name: Mark run failed if bot failed
        if: ${{ steps.bot.outcome == 'failure' }}
        run: |
          echo "บอตจบด้วย error (ดูล็อกของขั้น Run bot)"
          exit 1
